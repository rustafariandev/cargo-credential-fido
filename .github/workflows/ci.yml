name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # rustafariandev/virtual-fido-rs commit the end-to-end tests run against.
  VIRTUAL_FIDO_REF: 0ad4b5b88f9f1f5372a471dfd9d0c4c99ba100f3

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # hidapi (via ctap-hid-fido2) links libudev.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      # Per OS, so the cfg(windows) and cfg(target_os = "macos") code is linted too.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Saving the store to a volume without ACLs (like a FAT or exFAT USB stick)
      # skips the owner-only DACL instead of failing. The runner is elevated, so
      # it can mount an exFAT virtual disk.
      - name: Mount an exFAT virtual disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = "$env:RUNNER_TEMP\no-acl.vhdx"
          @"
          create vdisk file="$vhd" maximum=64 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=exfat quick label=NOACL
          assign
          "@ | Set-Content -Encoding ascii "$env:RUNNER_TEMP\no-acl.diskpart"
          diskpart /s "$env:RUNNER_TEMP\no-acl.diskpart"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $letter = (Get-Volume -FileSystemLabel NOACL).DriveLetter
          "CARGO_CREDENTIAL_FIDO_TEST_NO_ACL_DIR=${letter}:\" >> $env:GITHUB_ENV
      - if: runner.os == 'Windows'
        run: cargo test -- --ignored save_works_on_a_volume_without_acls

  # Runs the provider against virtual-fido, a software FIDO2 key that appears as a
  # real HID device through /dev/uhid.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rustafariandev/virtual-fido-rs
          ref: ${{ env.VIRTUAL_FIDO_REF }}
          path: virtual-fido
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            virtual-fido
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      # Used by scripts/e2e.sh to set the PIN on the virtual key.
      - run: pip install "fido2==0.9.3"
      - name: Load the uhid kernel module
        run: |
          sudo modprobe uhid || true
          if [ ! -e /dev/uhid ]; then
            echo "::error::/dev/uhid is not available on this runner kernel ($(uname -r))"
            exit 1
          fi
      # No desktop notifications needed: the key runs with --presence auto.
      - run: cargo build --manifest-path virtual-fido/Cargo.toml --no-default-features
      - run: scripts/e2e.sh virtual-fido/target/debug/virtual-fido
